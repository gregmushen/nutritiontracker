[project]
name = "nutritiontracker"
version = "0.1.0"
description = "Open-source nutrition tracker REST API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "click>=8.0",
    "setproctitle>=1.3",
]

[project.optional-dependencies]
data-import = [
    "pyarrow>=18.0",
    "openpyxl>=3.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pyarrow>=18.0",
    "openpyxl>=3.1",
    "ruff==0.15.12",
]

[project.scripts]
nutrition-pp-cli = "app.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
